[project]
name = "musubite-sidecar"
version = "0.1.0"
description = "Document extraction sidecar for Musubite (結び手)"
requires-python = ">=3.11"
dependencies = [
    "markitdown[all]>=0.1.0",
    "pymupdf>=1.24.0",
    "python-pptx>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# pymupdf / python-pptx ship without complete type information
disallow_untyped_calls = false
files = ["parser.py"]

[tool.coverage.report]
fail_under = 90
