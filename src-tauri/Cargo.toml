[package]
name = "musubite"
version = "0.1.0"
description = "Musubite (結び手) - bind documents and hearing notes into a Claude Desktop prompt"
authors = ["Musubite contributors"]
license = "MIT"
repository = "https://github.com/Toshiaki0315/Musubite"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "musubite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
